description: Infineon TCPWM PWM

compatible: "infineon,tcpwm-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml, "infineon,system-interrupts.yaml"]

properties:
  "#pwm-cells":
    const: 3
    description: |
      Number of items to expect in a PWM
      - channel of the timer used for PWM (not used)
      - period to set in ns
      - flags: standard flags like PWM_POLARITY_NORMAL

  pinctrl-0:
    description: |
      PORT pin configuration for the PWM signal.
      We expect that the phandles will reference pinctrl nodes. These
      nodes will have a nodelabel that matches the Infineon SoC Pinctrl
      defines and have following
      format: p<port>_<pin>_<peripheral inst>_<signal>.

      Examples:
        pinctrl-0 = <&p1_1_pwm0_0>;
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true
    description: |
      Peripheral clock divider feeding this TCPWM counter.

      The driver dereferences this unconditionally - PWM_PERI_CLOCK_INIT in
      pwm_infineon_tcpwm.c reads peri-group, div-type and channel straight
      off the phandle - so it has always been mandatory in practice. Leaving
      it undeclared here meant omitting it produced a wall of macro expansion
      errors from devicetree_generated.h rather than a diagnostic naming the
      missing property.

      The divider must belong to the same peripheral instance and group as
      the TCPWM block, which the block's clk-dst encodes. Several PWM
      channels may share one divider when they share a period.

      Example:
        clocks = <&peri0_group1_16bit_0>;

pwm-cells:
  - channel
  - period
  - flags
