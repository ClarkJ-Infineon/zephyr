# KIT_PSC3M5_CC2 carries an isolated SEGGER J-Link LITE onboard debug probe,
# unlike KIT_PSC3M5_EVK which carries KitProg3.

source [find interface/jlink.cfg]
transport select swd

source [find target/infineon/psc3.cfg]

if { [info exists _ZEPHYR_BOARD_SERIAL] } {
	adapter serial $_ZEPHYR_BOARD_SERIAL
}
