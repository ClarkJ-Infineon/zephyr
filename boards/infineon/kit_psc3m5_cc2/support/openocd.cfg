# This board carries an isolated SEGGER J-Link LITE onboard debug probe
# rather than KitProg3, hence interface/jlink.cfg below.

source [find interface/jlink.cfg]
transport select swd

source [find target/infineon/psc3.cfg]

if { [info exists _ZEPHYR_BOARD_SERIAL] } {
	adapter serial $_ZEPHYR_BOARD_SERIAL
}
